# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
# Agent roster for the dispatcher's stages (triage, code, review, fix,
# retro, prioritize). This is a deny-list: a stage runs unless a
# matching entry sets `enabled: false`, so unlisted agents stay
# enabled. A full allow-list is impractical, because validation
# rejects an enabled entry that carries only a name.
#
# Residual risks, each of which fails open silently:
#   - Names are matched by exact (downcased) equality and are never
#     checked against real stage names, so a typo just runs the stage.
#     After editing, confirm the intended stage reports skipped in the
#     dispatch run log.
#   - A stage added by a future upstream release is not listed here and
#     runs by default. Re-check this list against the dispatcher when
#     bumping the pinned fullsend version.
#   - `fullsend repos install` / `converge` still write a `roles:` key
#     holding the upstream default roster, which contradicts this list.
#     Re-check this file after any scaffold run. (v0.51.0 removed the
#     `Check role is enabled` gate from the dispatcher, not the
#     `roles:` key itself — the key is still written and validated, it
#     is simply no longer read when deciding which stages run.)
agents:
    - name: retro
      enabled: false
    - name: prioritize
      enabled: false
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - rh-pvsec/crypto-rules-image
            - fullsend-ai/fullsend
inference:
    project: it-gcp-pvsec-fullsend
    wif_provider: projects/826847573293/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-rh-pvsec-crypto-rules-image
